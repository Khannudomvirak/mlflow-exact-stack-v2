name: lakehouse-exact

# The exact stack from the professor's drawing:
#   Sources -> ingestion -> S3 data lake (Parquet + Iceberg + Nessie catalog)
#   Dremio -> dashboards        (optional profile; runs here with a 6 GB WSL cap)
#   Spark  -> Jupyter notebooks (this compose file)
#   MLflow is the added model-lifecycle layer.
#
# Secrets are service-to-service: every consumer has its own Vault identity
# (AppRole + policy) and asks Vault for what it needs at start. Only `vault-init`
# holds the dev root token.

services:
  # ------------------------------------------------------------- Secrets
  # Dev-mode Vault: in-memory store, already unsealed, fixed root token.
  # Demo only - the store is lost on restart and the port must stay local.
  vault:
    image: hashicorp/vault:2.2.2
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-lakehouse-dev-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: server -dev
    ports:
      - "${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One shot, the only container with the root token: stores the MinIO keys,
  # then issues a policy + AppRole per consumer and drops that role's
  # role_id/secret_id into the consumer's own approle volume. Safe to re-run.
  vault-init:
    image: hashicorp/vault:2.2.2
    # The image runs as an unprivileged user; root keeps the named volumes simple.
    user: "0:0"
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-lakehouse-dev-root}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SERVICES: nessie mlflow
      TOKEN_TTL: 1h
    entrypoint: ["/bin/sh", "/vault-init.sh"]
    volumes:
      - ./setup/vault_init.sh:/vault-init.sh:ro
      - approle-nessie:/approle/nessie
      - approle-mlflow:/approle/mlflow
    restart: "no"

  # ------------------------------------------------------------------ S3
  # MinIO's own root login cannot come from Vault: it has to exist before
  # anything can store it. That pair stays the one bootstrap secret in .env.
  minio:
    # MinIO RELEASE.2026-10-23, pinned by digest for reproducible builds.
    image: cgr.dev/chainguard/minio@sha256:73297936408b731668ca0e835ac9add1a35cb6026a125c2f0cd476d9ef48222c
    # The Chainguard image runs as uid 65532; root keeps the named volume simple.
    user: "0:0"
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # object browser
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # Creates the two buckets once MinIO answers. Safe to re-run.
  minio-init:
    image: amazon/aws-cli@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
    depends_on:
      minio:
        condition: service_started
    environment:
      AWS_DEFAULT_REGION: us-east-1
      # The admin bootstrap pair, same values `minio` itself starts with.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export AWS_ACCESS_KEY_ID="$$MINIO_ROOT_USER"
        export AWS_SECRET_ACCESS_KEY="$$MINIO_ROOT_PASSWORD"
        until aws --endpoint-url http://minio:9000 s3 ls >/dev/null 2>&1; do
          echo "waiting for MinIO..."
          sleep 2
        done
        aws --endpoint-url http://minio:9000 s3 mb s3://warehouse --region us-east-1 || true
        aws --endpoint-url http://minio:9000 s3 mb s3://mlflow --region us-east-1 || true
        echo "buckets ready: warehouse, mlflow"
    restart: "no"

  # ------------------------------------------------------- Service logins
  # One sidecar per consumer: logs in with that service's AppRole, reads only
  # what its policy allows, and renders it where the service mounts it. This is
  # Vault Agent's pattern without the extra machinery.
  nessie-creds:
    image: hashicorp/vault:2.2.2
    user: "0:0"
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: http://vault:8200
      SERVICE: nessie
      APPROLE_DIR: /approle
      CREDS_FILE: /credentials/s3.env
    entrypoint: ["/bin/sh", "/vault-fetch.sh"]
    volumes:
      - ./setup/vault_fetch.sh:/vault-fetch.sh:ro
      - approle-nessie:/approle:ro
      - s3-creds-nessie:/credentials
    restart: "no"

  mlflow-creds:
    image: hashicorp/vault:2.2.2
    user: "0:0"
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      VAULT_ADDR: http://vault:8200
      SERVICE: mlflow
      APPROLE_DIR: /approle
      CREDS_FILE: /credentials/s3.env
    entrypoint: ["/bin/sh", "/vault-fetch.sh"]
    volumes:
      - ./setup/vault_fetch.sh:/vault-fetch.sh:ro
      - approle-mlflow:/approle:ro
      - s3-creds-mlflow:/credentials
    restart: "no"

  # -------------------------------------------------------------- Catalog
  nessie:
    image: ghcr.io/projectnessie/nessie:0.109.0
    user: "0:0"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      nessie-creds:
        condition: service_completed_successfully
    environment:
      # Persist catalog commits in RocksDB (survives a container restart).
      NESSIE_VERSION_STORE_TYPE: ROCKSDB
      NESSIE_VERSION_STORE_PERSIST_ROCKS_DATABASE_PATH: /nessie/data
      NESSIE_VERSION_STORE_PERSIST_CACHE_CAPACITY_MB: "32"
      JAVA_OPTS_APPEND: -Xmx512m
      # The warehouse Nessie manages: an S3 path, served through the REST catalog.
      # Nessie's secret references use dotted property names, matching the
      # official projectnessie compose example.
      nessie.catalog.default-warehouse: warehouse
      nessie.catalog.warehouses.warehouse.location: s3://warehouse/
      nessie.catalog.service.s3.default-options.region: us-east-1
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      nessie.catalog.service.s3.default-options.endpoint: http://minio:9000/
      nessie.catalog.service.s3.default-options.external-endpoint: http://minio:9000/
    # The access-key pair comes from this service's own Vault-rendered file,
    # not from .env and not from a file another service also reads. The dotted
    # names are Quarkus environment properties.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        . /credentials/s3.env
        exec env \
          "nessie.catalog.secrets.access-key.name=$$S3_ACCESS_KEY" \
          "nessie.catalog.secrets.access-key.secret=$$S3_SECRET_KEY" \
          /opt/jboss/container/java/run/run-java.sh
    ports:
      - "${NESSIE_PORT:-19120}:19120"
    volumes:
      - nessie-data:/nessie/data
      - s3-creds-nessie:/credentials:ro
    restart: unless-stopped

  # --------------------------------------------------------------- MLflow
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
      args:
        # Change either one if the host Ollama runs a different model or port.
        MLFLOW_ASSISTANT_MODEL: ${MLFLOW_ASSISTANT_MODEL:-qwen2.5-coder:3b}
        OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      mlflow-creds:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_S3_IGNORE_TLS: "true"
      AWS_DEFAULT_REGION: us-east-1
      # Lets the Assistant API accept the browser's request, which arrives from
      # the Docker gateway rather than loopback. See setup/enable_mlflow_assistant.py.
      MLFLOW_ENABLE_REMOTE_ASSISTANT: "true"
    # The S3 keys come from this service's own Vault-rendered file.
    # "$$@" is the command list below, exec'd once the env is loaded.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        . /credentials/s3.env
        export AWS_ACCESS_KEY_ID="$$S3_ACCESS_KEY"
        export AWS_SECRET_ACCESS_KEY="$$S3_SECRET_KEY"
        exec "$$@"
      - mlflow-entrypoint
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=s3://mlflow
      - --serve-artifacts
      - --workers=1
      - --allowed-hosts=localhost,127.0.0.1,mlflow,spark,localhost:5000,127.0.0.1:5000,mlflow:5000,spark:5000
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
      - s3-creds-mlflow:/credentials:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------- Spark compute + Jupyter
  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    depends_on:
      nessie:
        condition: service_started
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GIT_PYTHON_REFRESH: quiet
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - .:/workspace
    working_dir: /workspace
    command:
      - bash
      - -lc
      - >-
        jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
        --ServerApp.root_dir=/workspace
        --ServerApp.token= --ServerApp.password=
    restart: unless-stopped

  # ------------------------------------------------- Optional: Dremio / BI
  # Not started by default. Needs a 6 GB WSL cap and a pre-pulled image
  # (pulling at the old 7.4 GiB cap froze the host). Dremio refuses < 4 GB heap.
  #   docker compose --profile dremio up -d dremio
  # Then add a Nessie source in Dremio at http://nessie:19120/api/v2.
  dremio:
    profiles: ["dremio"]
    image: dremio/dremio-oss:26.0.5
    ports:
      - "9047:9047"     # Dremio UI
      - "31010:31010"   # ODBC/JDBC
      - "32010:32010"   # Arrow flight
    environment:
      DREMIO_MAX_MEMORY_SIZE_MB: "${DREMIO_MAX_MEMORY_SIZE_MB:-4096}"
    volumes:
      - dremio-data:/opt/dremio/data
    restart: unless-stopped

volumes:
  approle-nessie:
  approle-mlflow:
  s3-creds-nessie:
  s3-creds-mlflow:
  minio-data:
  nessie-data:
  mlflow-data:
  dremio-data:
